name: Build 8BP Pro Tool EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Install Windows Dependencies
        run: |
          pip install pywin32

      - name: Verify Required Files
        run: |
          if (-Not (Test-Path "models/best.pt")) {
            Write-Host "ERROR: models/best.pt not found"
            exit 1
          }

          if (-Not (Test-Path "main.py")) {
            Write-Host "ERROR: main.py not found"
            exit 1
          }

          Write-Host "All required files found."

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed main.py --add-data "models/best.pt;models" --hidden-import win32gui --hidden-import win32con --hidden-import win32api --collect-all pywin32

      - name: Verify Build Output
        run: |
          if (-Not (Test-Path "dist/main.exe")) {
            Write-Host "ERROR: EXE was not generated"
            exit 1
          }

          Write-Host "EXE generated successfully."

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8BP-Pro-Tool-EXE
          path: dist/main.exe
          retention-days: 7
