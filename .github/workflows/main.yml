name: 8BP Pro Tool CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install System Dependencies for OpenCV
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglx-mesa0 libglib2.0-0

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify YOLO Weights Existence
      run: |
        if [ ! -f "models/best.pt" ]; then
          echo "Error: models/best.pt is missing!"
          exit 1
        fi

    - name: Run Physics and Detection Automated Tests
      run: |
        python -m pytest test_physics.py || true
        python test_detector.py || true

    - name: Run Core Main Script Test
      run: |
        python main.py --ci || true

    - name: Run Debug Crop Tool
      run: |
        python debug_crop.py || true

    - name: Upload Visual Validation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: visual-validation-results
        path: |
          *.png
          *.jpg
        retention-days: 5
