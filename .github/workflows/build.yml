name: Build Mini-Ruler EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

          # Windows optional fix (safe fallback)
          pip install pypiwin32 || echo "win32 optional skipped"

      # ================= IMPORTANT FIX =================
      - name: Ensure Model Exists
        run: |
          if (!(Test-Path "models/best.pt")) {
            Write-Host "ERROR: model missing"
            exit 1
          }

      # ================= BUILD =================
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed main.py `
          --add-data "models/best.pt;models" `
          --hidden-import cv2 `
          --hidden-import numpy `
          --hidden-import ultralytics `
          --hidden-import torch `
          --hidden-import win32gui `
          --hidden-import win32con `
          --hidden-import win32api

      # ================= UPLOAD =================
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Ruler-EXE
          path: dist/*.exe